        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        let controls = null;
        if (THREE.OrbitControls) {
          controls = new THREE.OrbitControls(camera, renderer.domElement);
          controls.enableDamping = true;
          controls.dampingFactor = 0.05;
          controls.maxDistance = 60;
          controls.minDistance = 10;
        }

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        const backLight = new THREE.DirectionalLight(0xa5d6a7, 0.5);
        backLight.position.set(-20, -20, -20);
        scene.add(backLight);

        const chloroplastGroup = new THREE.Group();
        scene.add(chloroplastGroup);

        // Outer Membrane
        const outerGeo = new THREE.SphereGeometry(12, 32, 24);
        outerGeo.scale(1.4, 0.75, 1);
        const outerMat = new THREE.MeshPhysicalMaterial({
          color: 0x4CAF50,
          transparent: true,
          opacity: 0.28,
          roughness: 0.2,
          transmission: 0.6,
          thickness: 1.5,
          depthWrite: false,
        });
        const outerMesh = new THREE.Mesh(outerGeo, outerMat);
        chloroplastGroup.add(outerMesh);

        // Inner Membrane
        const innerGeo = new THREE.SphereGeometry(11.4, 32, 24);
        innerGeo.scale(1.38, 0.72, 0.98);
        const innerMat = new THREE.MeshStandardMaterial({
          color: 0x81C784,
          transparent: true,
          opacity: 0.2,
          depthWrite: false
        });
        const innerMesh = new THREE.Mesh(innerGeo, innerMat);
        chloroplastGroup.add(innerMesh);

        // Granum stacks
        const granumPositions = [
          [-6, 0, -3],
          [-2, 0, -4],
          [3, 0, -3],
          [7, 0, -2],
          [-7, 0, 1],
          [-2, 0, 1],
          [3, 0, 2],
          [7, 0, 2],
          [-4, 0, 4],
          [1, 0, 5],
        ];

        const discGeo = new THREE.CylinderGeometry(1.4, 1.4, 0.35, 24);
        const granumMat = new THREE.MeshStandardMaterial({
          color: 0x1B5E20,
          roughness: 0.3,
          metalness: 0.1
        });

        granumPositions.forEach(([gx, gy, gz]) => {
          const discsCount = Math.floor(Math.random() * 3) + 5;
          for (let i = 0; i < discsCount; i++) {
            const disc = new THREE.Mesh(discGeo, granumMat);
            disc.position.set(gx, -1.5 + i * 0.45, gz);
            chloroplastGroup.add(disc);
          }
        });

        // Stroma Lamellae
        const lamellaMat = new THREE.MeshStandardMaterial({
          color: 0x43A047,
          roughness: 0.4
        });
        const lamella1 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 9, 12), lamellaMat);
        lamella1.rotation.z = Math.PI / 2;
        lamella1.position.set(0, 0, -3.5);
        chloroplastGroup.add(lamella1);

        const lamella2 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 11, 12), lamellaMat);
        lamella2.rotation.z = Math.PI / 2;
        lamella2.position.set(0, 0, 1.5);
        chloroplastGroup.add(lamella2);

        let animationId;
        const animate = () => {
          animationId = requestAnimationFrame(animate);
          if (rotating) {
            chloroplastGroup.rotation.y += 0.005;
          }
          if (controls) controls.update();
          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!container) return;
          const newW = container.clientWidth;
          const newH = container.clientHeight || 440;
          camera.aspect = newW / newH;
          camera.updateProjectionMatrix();
          renderer.setSize(newW, newH);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(animationId);
          window.removeEventListener('resize', handleResize);
          if (container && renderer.domElement) {
            container.removeChild(renderer.domElement);
          }
        };
      }, [rotating]);

      return (
        <div className="space-y-6 animate-fadeIn">
          <div className="border-b border-gray-200 pb-4">
            <span className="text-xs font-bold text-study-600 uppercase tracking-wide">3D Interactive Simulator</span>
            <h2 className="text-2xl md:text-3xl font-bold text-study-900 mt-1">3D Chloroplast Viewer (โครงสร้างคลอโรพลาสต์ 3 มิติ)</h2>
            <p className="text-sm text-gray-600 mt-1">
              หมุน ซูม เพื่อสำรวจเยื่อหุ้มสองชั้น ไทลาคอยด์ กรานุม สโตรมา และสโตรมาลาเมลลาแบบสมจริง
            </p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 bg-white rounded-3xl border border-study-200 shadow-md overflow-hidden relative flex flex-col">
              <div className="absolute top-4 left-4 z-10 flex space-x-2">
                <button
                  onClick={() => setRotating(!rotating)}
                  className="px-3 py-1.5 bg-white/90 backdrop-blur rounded-xl text-xs font-semibold shadow border border-gray-200 hover:bg-white text-gray-800 transition"
                >
                  {rotating ? '⏸️ หยุดหมุนชั่วคราว' : '▶️ หมุนอัตโนมัติ'}
                </button>
              </div>

              <div className="absolute bottom-4 right-4 z-10 text-[11px] bg-white/80 backdrop-blur px-2.5 py-1 rounded-lg border border-gray-200 text-gray-600">
                🖱️ ลากเพื่อหมุน • เลื่อนเมาส์/บีบหน้าจอเพื่อซูม
              </div>

              <div ref={mountRef} className="w-full h-[380px] sm:h-[450px]" />
            </div>

            <div className="bg-white p-6 rounded-3xl border border-study-200 shadow-sm flex flex-col justify-between">
              <div>
                <h3 className="text-base font-bold text-study-900 mb-3 flex items-center space-x-2">
                  <span>🏷️</span>
                  <span>เลือกชิ้นส่วนเพื่อดูหน้าที่</span>

                <div className="grid grid-cols-2 gap-2 mb-6">
                  {Object.keys(PARTS_INFO).map(key => (

              <div className="mt-6 pt-4 border-t border-gray-100 text-xs text-gray-500">
                💡 <span className="font-semibold text-gray-700">ทริคสอบ:</span> ปฏิกิริยาแสงเกิดที่ <span className="text-study-800 font-bold">Thylakoid Membrane</span> ส่วนวัฏจักรคัลวินเกิดที่ <span className="text-study-800 font-bold">Stroma</span>!

    // --- Component: Exam Simulator (TH Sarabun, 60s Countdown, Cut-Choice Hint) ---
    function ExamSimulatorView() {
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [selectedOptions, setSelectedOptions] = useState({});
      const [timeLeft, setTimeLeft] = useState(60);
      const [eliminatedOptions, setEliminatedOptions] = useState({});
      const [isFinished, setIsFinished] = useState(false);
      const [showReview, setShowReview] = useState(false);

      const q = EXAM_QUESTIONS[currentQIndex];

      // Countdown Timer (60s per question)
      useEffect(() => {
        if (isFinished) return;
        
        const timer = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 1) {
              if (currentQIndex < EXAM_QUESTIONS.length - 1) {
                setCurrentQIndex(c => c + 1);
                return 60;
              } else {
                setIsFinished(true);
                return 0;
              }
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(timer);
      }, [currentQIndex, isFinished]);

      const handleNextQuestion = () => {
        if (currentQIndex < EXAM_QUESTIONS.length - 1) {
          setCurrentQIndex(prev => prev + 1);
          setTimeLeft(60);
        } else {
          finishExam();
        }
      };

      const handlePrevQuestion = () => {
        if (currentQIndex > 0) {
          setCurrentQIndex(prev => prev - 1);
          setTimeLeft(60);
        }
      };

      const handleSelectOption = (idx) => {
        if (isFinished) return;
        setSelectedOptions({
          ...selectedOptions,
          [currentQIndex]: idx
        });
      };

      const handleEliminateDistractor = () => {
        setEliminatedOptions({
          ...eliminatedOptions,
          [currentQIndex]: true
        });
      };

      const finishExam = () => {
        setIsFinished(true);
        if (window.confetti) {
          window.confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
      };

      const calculateScore = () => {
        let score = 0;
        EXAM_QUESTIONS.forEach((quest, i) => {
          if (selectedOptions[i] === quest.correctIndex) {
            score++;
          }
        });
        return score;
      };

      if (isFinished) {
        const score = calculateScore();
        const percentage = Math.round((score / EXAM_QUESTIONS.length) * 100);

        return (
          <div className="space-y-6 font-sarabun animate-fadeIn max-w-3xl mx-auto">
            <div className="bg-white p-8 rounded-3xl border-2 border-study-200 shadow-xl text-center">
              <span className="text-6xl block mb-3">
                {percentage >= 80 ? '🏆' : percentage >= 50 ? '🌟' : '📚'}
              </span>
              <h2 className="text-3xl font-bold text-study-950">สรุปผลการทดสอบจำลองเสมือนจริง</h2>
              <p className="text-gray-600 mt-1 text-base">
                รายวิชาชีววิทยา เรื่อง กระบวนการสังเคราะห์ด้วยแสง (Photosynthesis)
              </p>

              <div className="my-8 p-6 bg-study-50 rounded-2xl border border-study-200 max-w-sm mx-auto">
                <div className="text-sm text-study-700 font-bold uppercase tracking-wider">คะแนนที่ทำได้</div>
                <div className="text-5xl font-extrabold text-study-900 my-2">
                  {score} / {EXAM_QUESTIONS.length}
                </div>
                <div className="text-base font-semibold text-study-800">
                  คิดเป็น {percentage}%
                </div>
              </div>

              <div className="flex justify-center gap-4">
                <button
                  onClick={() => setShowReview(!showReview)}
                  className="px-6 py-3 bg-study-700 text-white rounded-2xl font-bold text-base shadow hover:bg-study-800 transition"
                >
                  {showReview ? 'ซ่อนเฉลยละเอียด' : '🔍 ดูเฉลยและเทคนิคตัดช้อยส์'}
                </button>
                <button
                  onClick={() => {
                    setSelectedOptions({});
                    setEliminatedOptions({});
                    setCurrentQIndex(0);
                    setTimeLeft(60);
                    setIsFinished(false);
                    setShowReview(false);
                  }}
                  className="px-6 py-3 bg-white border border-gray-300 text-gray-800 rounded-2xl font-bold text-base hover:bg-gray-50 transition"
                >
                  🔄 ทำข้อสอบใหม่อีกครั้ง
                </button>
              </div>
            </div>

            {showReview && (
              <div className="space-y-6 mt-6">
                <h3 className="text-2xl font-bold text-study-950 border-b pb-2">เฉลยละเอียดรายข้อ พร้อมเทคนิคตัดช้อยส์</h3>
                {EXAM_QUESTIONS.map((quest, qIdx) => {
                  const userAns = selectedOptions[qIdx];
                  const isCorrect = userAns === quest.correctIndex;

                  return (
                    <div 
                      key={qIdx}

                                : 'bg-gray-50 border-gray-200 text-gray-600'
                            }`}
                          >
                            <span>({optIdx + 1}) {opt}</span>
                            {optIdx === quest.correctIndex && <span className="text-xs bg-emerald-600 text-white px-2 py-0.5 rounded">คำตอบที่ถูกต้อง</span>}
                            {optIdx === userAns && optIdx !== quest.correctIndex && <span className="text-xs bg-rose-600 text-white px-2 py-0.5 rounded">คำตอบของคุณ</span>}
                          </div>
                        ))}
                      </div>

                      <div className="bg-amber-50 p-3.5 rounded-xl border border-amber-200 text-sm mb-3">
                        <span className="font-bold text-amber-900">✂️ เทคนิคการตัดช้อยส์: </span>
                        <span className="text-amber-950">{quest.eliminationReason}</span>
                      </div>

                      <div className="bg-study-50 p-3.5 rounded-xl border border-study-100 text-sm">
                        <span className="font-bold text-study-900">📖 คำอธิบายความรู้: </span>
                        <span className="text-study-800">{quest.explanation}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      }

      const timerPercent = (timeLeft / 60) * 100;
      const isUrgent = timeLeft <= 30;

      return (
        <div className="space-y-6 font-sarabun animate-fadeIn max-w-3xl mx-auto">
          {/* Exam Header */}
          <div className="bg-white p-5 rounded-2xl border border-study-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div>
              <div className="flex items-center space-x-2">
                <span className="text-xs bg-stone-100 text-stone-700 font-bold px-2 py-0.5 rounded">
                  แบบทดสอบมาตรฐาน TH Sarabun
                </span>
                <span className="text-xs text-gray-500">ข้อละ 60 วินาที</span>
              </div>
              <h2 className="text-xl font-bold text-study-900 mt-1">
                แบบทดสอบจำลอง: ข้อที่ {currentQIndex + 1} จาก {EXAM_QUESTIONS.length}
              </h2>
            </div>

            {/* Timer Badge */}
            <div className="flex items-center space-x-3">
              <div className={`px-4 py-2 rounded-2xl border-2 flex items-center space-x-2 transition ${
                isUrgent 
                  ? 'bg-red-50 border-red-500 text-red-700 animate-pulse' 
                  : 'bg-study-50 border-study-300 text-study-900'
              }`}>
                <span className="text-lg">⏱️</span>
                <span className="text-xl font-extrabold tracking-wider">{timeLeft}s</span>
              </div>
            </div>
          </div>

          {/* Timer Progress Bar (turns RED at < 30s) */}
          <div className="w-full bg-gray-200 h-2.5 rounded-full overflow-hidden shadow-inner">
            <div 
              className={`h-full transition-all duration-1000 ease-linear ${
                isUrgent ? 'bg-red-500 shadow-lg shadow-red-300' : 'bg-study-500'
              }`}
              style={{ width: `${timerPercent}%` }}
            />
          </div>

          {/* Question Box */}
          <div className="bg-white p-6 sm:p-8 rounded-3xl border border-study-200 shadow-md">
            <h3 className="text-xl sm:text-2xl font-bold text-gray-900 leading-relaxed mb-6">
              ข้อ {currentQIndex + 1}. {q.question}
            </h3>

            {/* Elimination Tool Button */}
            <div className="mb-6 flex items-center justify-between bg-amber-50/70 p-3 rounded-2xl border border-amber-200">
              <div className="flex items-center space-x-2 text-xs sm:text-sm text-amber-950 font-medium">
                <span>💡</span>
                <span>ไม่มั่นใจ? ฝึกทักษะการตัดช้อยส์หลอก</span>
              </div>
              <button
                onClick={handleEliminateDistractor}
                disabled={eliminatedOptions[currentQIndex]}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 shadow-sm ${
                  eliminatedOptions[currentQIndex]
                    ? 'bg-gray-200 text-gray-400 cursor-not-allowed'
                    : 'bg-amber-400 hover:bg-amber-500 active:scale-95 text-amber-950'
                }`}
              >
                <span>✂️</span>
                <span>{eliminatedOptions[currentQIndex] ? 'ตัดช้อยส์ไปแล้ว' : 'กดตัด 1 ช้อยส์หลอก'}</span>
              </button>
            </div>

            {/* Hint reveal banner if cut */}
            {eliminatedOptions[currentQIndex] && (
              <div className="mb-4 p-3 bg-rose-50 border-l-4 border-rose-500 rounded-r-xl text-xs text-rose-900 leading-relaxed animate-fadeIn">
                <span className="font-bold">🎯 เทคนิคตัดช้อยส์: </span>
                <span>{q.eliminationReason}</span>
              </div>
            )}

            {/* 4 Choices */}
            <div className="space-y-3">
              {q.options.map((option, optIdx) => {
                const isSelected = selectedOptions[currentQIndex] === optIdx;
                const isCrossedOut = eliminatedOptions[currentQIndex] && optIdx === q.eliminationIndex;

                return (
                  <button
                    key={optIdx}
                    onClick={() => !isCrossedOut && handleSelectOption(optIdx)}
                    disabled={isCrossedOut}
                    className={`w-full text-left p-4 rounded-2xl border-2 transition relative flex items-start space-x-3 text-base sm:text-lg ${
                      isCrossedOut 
                        ? 'opacity-40 bg-gray-100 border-gray-300 cursor-not-allowed line-through text-gray-400'
                        : isSelected
                        ? 'bg-study-50 border-study-600 text-study-950 font-bold shadow-sm'
                        : 'bg-white border-gray-200 hover:bg-stone-50 hover:border-gray-300 text-gray-800'
                    }`}
                  >
                    <span className={`w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold shrink-0 mt-0.5 ${
                      isSelected ? 'bg-study-600 text-white' : 'bg-gray-100 text-gray-700'
                    }`}>
                      {optIdx + 1}
                    </span>
                    <span className="flex-1">{option}</span>
                    {isCrossedOut && (
                      <span className="text-xs bg-red-100 text-red-700 font-bold px-2 py-0.5 rounded ml-2 shrink-0">
                        ตัดทิ้ง ✕
                      </span>
                    )}
                  </button>
                );
              })}
            </div>

            {/* Navigation buttons */}
            <div className="mt-8 pt-6 border-t border-gray-100 flex items-center justify-between">
              <button
                onClick={handlePrevQuestion}
                disabled={currentQIndex === 0}
                className="px-5 py-2.5 rounded-2xl border border-gray-300 text-sm font-bold text-gray-700 hover:bg-gray-50 disabled:opacity-30 disabled:cursor-not-allowed transition"
              >
                ← ข้อย้อนหลัง
              </button>

              <div className="text-xs text-gray-500 font-semibold">
                ตอบแล้ว {Object.keys(selectedOptions).length} / {EXAM_QUESTIONS.length} ข้อ
              </div>

              {currentQIndex < EXAM_QUESTIONS.length - 1 ? (
                <button
                  onClick={handleNextQuestion}
                  className="px-6 py-2.5 rounded-2xl bg-study-600 text-white text-sm font-bold hover:bg-study-700 transition shadow"
                >
                  ข้อถัดไป →
                </button>
              ) : (
                <button
                  onClick={finishExam}
                  className="px-6 py-2.5 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-700 text-white text-sm font-bold hover:from-emerald-700 hover:to-teal-800 transition shadow-lg"
                >
                  ส่งข้อสอบตรวจคะแนน ✨
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- Component: Short Note Canvas (Apple Pencil / Touch / Mouse Drawing) ---
    function ScratchCanvasView() {
      const canvasRef = useRef(null);
      const [color, setColor] = useState('#2D3748');
      const [lineWidth, setLineWidth] = useState(3);
      const [isDrawing, setIsDrawing] = useState(false);
      const [bgPattern, setBgPattern] = useState('grid');

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = (rect.height || 520) * dpr;
        
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
      }, []);

      const getCoordinates = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        let clientX = e.clientX;
        let clientY = e.clientY;

        if (e.touches && e.touches.length > 0) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        }

        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      };

      const startDrawing = (e) => {
        e.preventDefault();
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const { x, y } = getCoordinates(e);

        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        ctx.beginPath();
        ctx.moveTo(x, y);
        setIsDrawing(true);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        e.preventDefault();
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const { x, y } = getCoordinates(e);

        ctx.lineTo(x, y);
        ctx.stroke();
      };

      const stopDrawing = () => {
        setIsDrawing(false);
      };

      const clearCanvas = () => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      };

      const downloadNote = () => {
        const canvas = canvasRef.current;
        const link = document.createElement('a');
        link.download = 'photosynthesis-note.png';
        link.href = canvas.toDataURL();
        link.click();
      };

      return (
        <div className="space-y-4 animate-fadeIn">
          <div className="flex flex-wrap items-center justify-between gap-3 border-b border-gray-200 pb-3">
            <div>
              <span className="text-xs font-bold text-study-600 uppercase tracking-wide">iPad Apple Pencil Ready</span>
              <h2 className="text-2xl font-bold text-study-900">Short Note Canvas (กระดานทดเลข & วาดไดอะแกรม)</h2>
            </div>

            <div className="flex items-center space-x-2">
              <button
                onClick={clearCanvas}
                className="px-3 py-1.5 bg-white border border-gray-300 rounded-xl text-xs font-semibold text-gray-700 hover:bg-gray-50 transition"
              >
                🗑️ ล้างกระดาน
              </button>
              <button
                onClick={downloadNote}
                className="px-3 py-1.5 bg-study-600 text-white rounded-xl text-xs font-semibold hover:bg-study-700 transition shadow-sm"
              >
                📥 บันทึกเป็นรูปภาพ
              </button>
            </div>
          </div>

          {/* Toolbar */}
          <div className="bg-white p-4 rounded-2xl border border-study-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center space-x-2">
              <span className="text-xs font-bold text-gray-500">สีปากกา:</span>
              {[
                { label: 'ดินสอดำ', val: '#2D3748' },
                { label: 'เขียวใบไม้', val: '#2E7D32' },
                { label: 'แดงเน้นย้ำ', val: '#D32F2F' },
                { label: 'น้ำเงินปฏิกิริยา', val: '#1976D2' },
                { label: 'ไฮไลท์เหลือง', val: '#FBC02D' },
              ].map(c => (
                <button
                  key={c.val}
                  onClick={() => setColor(c.val)}
                  title={c.label}
                  className={`w-7 h-7 rounded-full border-2 transition transform ${
                    color === c.val ? 'scale-110 border-gray-900 shadow-md' : 'border-white hover:scale-105'
                  }`}
                  style={{ backgroundColor: c.val }}
                />
              ))}
              <button
                onClick={() => setColor('#fdfbf7')}
                className={`px-2.5 py-1 rounded-xl text-xs font-semibold border transition ${
                  color === '#fdfbf7' ? 'bg-amber-100 border-amber-400 text-amber-900' : 'bg-gray-50 border-gray-200 text-gray-700'
                }`}
              >
                🧹 ยางลบ
              </button>
            </div>

            <div className="flex items-center space-x-2">
              <span className="text-xs font-bold text-gray-500">ขนาดเส้น:</span>
              {[2, 4, 8, 14].map(size => (
                <button
                  key={size}
                  onClick={() => setLineWidth(size)}
                  className={`w-7 h-7 rounded-lg text-xs font-bold flex items-center justify-center border transition ${
                    lineWidth === size ? 'bg-study-600 text-white border-study-700' : 'bg-gray-50 text-gray-700 border-gray-200'
                  }`}
                >
                  {size}
                </button>
              ))}
            </div>

            <div className="flex items-center space-x-2">
              <span className="text-xs font-bold text-gray-500">พื้นหลัง:</span>
              <button
                onClick={() => setBgPattern('grid')}
                className={`px-2.5 py-1 rounded-lg text-xs font-medium border ${
                  bgPattern === 'grid' ? 'bg-study-100 text-study-900 border-study-300 font-bold' : 'text-gray-600 border-gray-200'
                }`}
              >
                ตารางกริด
              </button>
              <button
                onClick={() => setBgPattern('dots')}
                className={`px-2.5 py-1 rounded-lg text-xs font-medium border ${
                  bgPattern === 'dots' ? 'bg-study-100 text-study-900 border-study-300 font-bold' : 'text-gray-600 border-gray-200'
                }`}
              >
                จุดไข่ปลา
              </button>
              <button
                onClick={() => setBgPattern('blank')}
                className={`px-2.5 py-1 rounded-lg text-xs font-medium border ${
                  bgPattern === 'blank' ? 'bg-study-100 text-study-900 border-study-300 font-bold' : 'text-gray-600 border-gray-200'
                }`}
              >
                กระดาษเปล่า
              </button>
            </div>
          </div>

          {/* Canvas Wrapper */}
          <div 
            className={`w-full h-[540px] rounded-3xl border-2 border-dashed border-stone-300 shadow-inner overflow-hidden relative ${
              bgPattern === 'grid' ? 'bg-grid-pattern' : bgPattern === 'dots' ? 'bg-dot-pattern' : 'bg-[#FDFBF7]'
            }`}
          >
            <div className="absolute top-3 left-4 pointer-events-none text-xs text-stone-400 font-mali">
              ✍️ ทดสูตร / เขียนวัฏจักรคัลวิน / วาดไดอะแกรมด้วย Apple Pencil หรือนิ้วได้เลย...
            </div>
            <canvas
              ref={canvasRef}
              onMouseDown={startDrawing}
              onMouseMove={draw}
              onMouseUp={stopDrawing}
              onMouseLeave={stopDrawing}
              onTouchStart={startDrawing}
              onTouchMove={draw}
              onTouchEnd={stopDrawing}
              className="w-full h-full cursor-crosshair block"
            />
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
